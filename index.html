<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PopcornHUB</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#607823">

<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="favicon.ico" type="image/x-icon">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- VIDEO MODAL -->
<div id="detailModal" class="detailModal">
  <!-- dark background -->
  <div class="modalBackdrop"></div>

  <!-- modal box -->
  <div class="videoModalContent">
    <!-- VIDEO AREA -->
    <div class="videoContainer" id="videoContainer"></div>

    <!-- INFO SECTION -->
    <div class="videoMeta">
      <h2 style="margin-top: 15px;" id="modalTitle">Title</h2>
      <p id="modalOverview" style="color:#aaa; line-height:1.4;"></p>

      <!-- ONLY FOR TV / ANIME -->
      <div id="episodeControls" class="episodeGridContainer"></div>
    </div>
        <!-- close button -->
    <button class="closeBtn" onclick="closeModal()">✕</button>

  </div>
</div>

<header class="hero">
  <h1 onclick="goHome()" class="logo">
    <span class="popcorn">Popcorn</span>
    <span class="hub">HUB</span>
  </h1>
  <p>Watch Movies, TV Shows & Anime for Free</p>
</header>

<div id="searchContainer">
  <input id="searchInput" placeholder="Search Movies, TV, Anime...">
  <button onclick="searchAll()">Search</button>
</div>

<div id="emptySearch" class="emptySearch" style="display:none;">
    <i class="fa-solid fa-magnifying-glass"></i>
    <h2>No results found</h2>
    <p>Try searching for another movie, TV show, or anime.</p>
</div>

<div id="stats"></div>

<div id="loading">
  <div>Loading...</div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<!-- CONTINUE WATCHING -->
<div class="category" id="continueCategory" style="display:none;">
    <h2><i style="color:darkgray" class="fa-solid fa-clock-rotate-left"></i>
        Continue Watching
    </h2>
    <div class="carousel">
        <button class="arrow left" data-target="continueResults">
            ‹
        </button>
        <div id="continueResults" class="row"></div>
        <button class="arrow right" data-target="continueResults">
            ›
        </button>
    </div>
</div>

<!-- CATEGORIES -->
<div id="categoryGroup">
  <div class="category" id="movieCategory">
    <h2 id="movieCategoryTitle"><i style="color: darkgray" class="fa-solid fa-film"></i> Movies</h2>
    <div class="carousel">
      <button class="arrow left" data-target="movieResults">‹</button>
      <div id="movieResults" class="row"></div>
      <button class="arrow right" data-target="movieResults">›</button>
    </div>
  </div>

  <div class="category" id="tvCategory">
    <h2><i style= "color: darkgray" class="fa-solid fa-clapperboard"></i> TV Shows</h2>
    <div class="carousel">
      <button class="arrow left" data-target="tvResults">‹</button>
      <div id="tvResults" class="row"></div>
      <button class="arrow right" data-target="tvResults">›</button>
    </div>
  </div>

  <div class="category" id="animeCategory">
    <h2><i style= "color: darkgray" class="fa-solid fa-tv"></i> Anime</h2>
    <div class="carousel">
      <button class="arrow left" data-target="animeResults">‹</button>
      <div id="animeResults" class="row"></div>
      <button class="arrow right" data-target="animeResults">›</button>
    </div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
