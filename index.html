<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEASY ID SEARCH V2</title>

<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: Arial, sans-serif;
  background: #141414;
  color: #fff;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(20,20,20,1));
}
.hero h1 {
  margin-bottom: 10px;
  font-size: 48px;
}
.red { color: #e50914; }
.hero p {
  color: #ccc;
  font-size: 18px;
}

/* SEARCH */
#searchContainer {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #141414ee;
  backdrop-filter: blur(10px);
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
#searchInput {
  flex: 1;
  min-width: 250px;
  max-width: 500px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #333;
  outline: none;
  background: #222;
  color: #fff;
  font-size: 16px;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: #e50914;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
}
button:hover { background: #ff1e2d; }

/* STATS */
#stats {
  text-align: center;
  color: #aaa;
  padding: 15px;
  font-size: 14px;
}

/* CATEGORIES */
.category {
  padding: 25px 30px;
}
.category h2 {
  margin-bottom: 15px;
  font-size: 22px;
  border-left: 5px solid #e50914;
  padding-left: 10px;
}

/* ROW */
.row {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  overflow-y: hidden;   /* IMPORTANT: prevents vertical jitter */
  padding-bottom: 10px;
  align-items: flex-start;
  scroll-behavior: smooth;
  scrollbar-gutter: stable; /* prevents scrollbar shift */
}
.row::-webkit-scrollbar {
  height: 8px;
}
.row::-webkit-scrollbar-thumb {
  background: #444;
  border-radius: 10px;
}

/* MOVIE CARDS */
.movie {
  min-width: 180px;
  max-width: 180px;
  height: 270px;
  cursor: pointer;
  position: relative;
  transition: transform 0.25s, box-shadow 0.25s;
}
.movie:hover {
  transform: scale(1.06);
  z-index: 5;
  will-change: transform;
}
.movie img {
  width: 100%;
  height: 100%;        /* IMPORTANT */
  object-fit: cover;
  display: block;      /* removes inline image gap bug */
  border-radius: 8px;
}
.movieInfo {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.95));
  opacity: 0;
  transform: translateY(20px);
  transition: 0.25s;
}
.movie:hover .movieInfo {
  opacity: 1;
  transform: translateY(0);
}
.genre {
  font-size: 13px;
  color: #ccc;
  margin-top: 5px;
}

/* LOADING */
#loading {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}
#bar {
  width: 300px;
  height: 6px;
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 15px;
}
#barFill {
  height: 100%;
  background: #e50914;
  animation: load 1.5s infinite;
}
@keyframes load {
  0% { width: 0%; }
  50% { width: 70%; }
  100% { width: 100%; }
}

/* COPY MODAL */
#copyModal {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) scale(0.8);
  background: #000;
  border: 1px solid #e50914;
  padding: 12px 18px;
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  z-index: 100;
}
#copyModal.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

.carousel {
  position: relative;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 100%;
  border: none;
  border-radius: 0;
  background: transparent;
  color: #fff;
  font-size: 58px;
  cursor: pointer;
  z-index: 10;

  opacity: 0.4;
  transition: opacity 0.2s ease, transform 0.2s ease;

  /* center the arrow text */
  display: flex;
  align-items: center;
  justify-content: center;

  /* add font shadow */
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}

.arrow:hover {
  background-color: transparent;
  opacity: 1;
  transform: translateY(-50%) scale(1.1);
}

.arrow.left {
  left: 0;
}

.arrow.right {
  right: 0;
}

@keyframes bounce {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-10px); }
  50%  { transform: translateX(5px); }
  75%  { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

.row.bounce {
  animation: bounce 0.3s ease;
}

/* =========================
   VIDEO MODAL (NETFLIX STYLE)
========================= */

.detailModal {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 9999;
}

.detailModal.show {
  display: block;
}

/* DARK BACKDROP */
.modalBackdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
}

/* MODAL BOX */
.videoModalContent {
  position: relative;
  width: 92%;
  max-width: 1000px;
  margin: 3% auto;
  background: #111;
  border-radius: 14px;
  overflow: hidden;
  animation: modalPop 0.2s ease;
}

@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* CLOSE BUTTON */
.closeBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  background: none;
  color: rgba(255, 255, 255, 0.51);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
}
.closeBtn:hover {
  color: rgb(255, 255, 255);
  background: none;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}

/* VIDEO RESPONSIVE CONTAINER */
.videoContainer {
  position: relative;
  padding-bottom: 56.25%; /* 16:9 ratio */
  height: 0;
  background: #000;
}

.videoContainer iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* INFO AREA */
.videoMeta {
  padding: 15px 18px;
  color: #fff;
}

.videoMeta h2 {
  margin-bottom: 5px;
  font-size: 20px;
}

.videoMeta p {
  margin: 3px 0;
  color: #aaa;
}

.modalButtons button {
  margin-top: 10px;
  padding: 10px 16px;
  border-radius: 20px;
  border: none;
  background: #e50914;
  color: #fff;
  cursor: pointer;
}

#episodeControls button:hover {
  background: #e50914 !important;
}

#episodeControls select {
  padding: 8px;
  border-radius: 8px;
  background: #222;
  color: #fff;
  border: none;
  margin-bottom: 10px;
}

#episodeControls{
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap; /* allows mobile wrap */
}
</style>
</head>

<body>

<!-- VIDEO MODAL -->
<div id="detailModal" class="detailModal">
  <!-- dark background -->
  <div class="modalBackdrop" onclick="closeModal()"></div>

  <!-- modal box -->
  <div class="videoModalContent">

    <!-- close button -->
    <button class="closeBtn" onclick="closeModal()">✕</button>

    <!-- VIDEO AREA -->
    <div class="videoContainer" id="videoContainer"></div>

    <!-- INFO SECTION -->
    <div class="videoMeta">
      <h2 id="modalTitle">Title</h2>
      <p id="modalOverview" style="color:#aaa; line-height:1.4;"></p>

      <!-- ONLY FOR TV / ANIME -->
      <div id="episodeControls" style="margin-top:15px;"></div>
    </div>

  </div>
</div>

<header class="hero">
  <h1 onclick="goHome()" style="cursor:pointer;">
  <span class="red">VIDEASY</span> ID SEARCH</h1>
  <p>Search Movies, TV Shows & Anime IDs</p>
</header>

<div id="searchContainer">
  <input id="searchInput" placeholder="Search Movies, TV, Anime...">
  <button onclick="searchAll()">Search</button>
</div>

<div id="stats"></div>

<div id="loading">
  <div>Searching...</div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<!-- CATEGORIES -->
<div class="category" id="movieCategory">
  <h2>🎬 Movies</h2>
  <div class="carousel">
    <button class="arrow left" data-target="movieResults">‹</button>
    <div id="movieResults" class="row"></div>
    <button class="arrow right" data-target="movieResults">›</button>
  </div>
</div>

<div class="category" id="tvCategory">
  <h2>📺 TV Shows</h2>
  <div class="carousel">
    <button class="arrow left" data-target="tvResults">‹</button>
    <div id="tvResults" class="row"></div>
    <button class="arrow right" data-target="tvResults">›</button>
  </div>
</div>

<div class="category" id="animeCategory">
  <h2>🎌 Anime</h2>
  <div class="carousel">
    <button class="arrow left" data-target="animeResults">‹</button>
    <div id="animeResults" class="row"></div>
    <button class="arrow right" data-target="animeResults">›</button>
  </div>
</div>

<div id="copyModal">Copied: <span id="copyText"></span></div>

<script>
let currentItem = null;
  
const TMDB_API_KEY = "7124d4e6e0feb015f07fc9a57bc27227";

const loading = document.getElementById("loading");
const copyModal = document.getElementById("copyModal");
const copyText = document.getElementById("copyText");

function showLoading(){ loading.style.display="flex"; }
function hideLoading(){ loading.style.display="none"; }

function showCopyModal(text){
  copyText.textContent = text;
  copyModal.classList.add("show");
  setTimeout(()=>copyModal.classList.remove("show"),1500);
}

/* =========================
   ENTER + DEBOUNCE SEARCH
========================= */
document.getElementById("searchInput").addEventListener("keydown", e=>{
  if(e.key==="Enter") searchAll();
});

let timeout;
document.getElementById("searchInput").addEventListener("input", ()=>{
  clearTimeout(timeout);
  timeout = setTimeout(searchAll, 600);
});

/* =========================
   HOME LOAD (TOP CONTENT)
========================= */
async function loadHome(){
  showLoading();

  let movies=[], tv=[], anime=[];

  try{
    const [m,t,a] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${TMDB_API_KEY}&language=en-US&page=1`),
      fetch(`https://api.themoviedb.org/3/tv/top_rated?api_key=${TMDB_API_KEY}&language=en-US&page=1`),
      fetch("https://graphql.anilist.co",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          query:`query {
            Page(perPage:10){
              media(type:ANIME, sort:POPULARITY_DESC){
                id
                title{romaji}
                coverImage{large}
              }
            }
          }`
        })
      })
    ]);

    const md = await m.json();
    const td = await t.json();
    const ad = await a.json();

  movies = (md.results||[]).map(i=>({
    type:"movie",
    id:i.id,
    title:i.title,
    poster:i.poster_path
      ? `https://image.tmdb.org/t/p/w500${i.poster_path}`
      : "",
    videasyUrl: `https://player.videasy.net/movie/${i.id}`
  }));

  tv = (td.results||[]).map(i=>({
    type:"tv",
    id:i.id,
    title:i.name,
    poster:i.poster_path
      ? `https://image.tmdb.org/t/p/w500${i.poster_path}`
      : "",
    // default to season 1 episode 1
    videasyUrl: `https://player.videasy.net/tv/${i.id}/1/1`
  }));

  anime = (ad?.data?.Page?.media||[]).map(i=>({
    type:"anime",
    id:i.id,
    title:i.title.romaji,
    poster:i.coverImage.large,
    // default to episode 1 (or full movie)
    videasyUrl: `https://player.videasy.net/anime/${i.id}/1`
  }));

  }catch(e){
    console.error(e);
  }

  render("movieCategory","movieResults",movies);
  render("tvCategory","tvResults",tv);
  render("animeCategory","animeResults",anime);

  hideLoading();
}

async function searchAll(){
  const input = document.getElementById("searchInput");
  const query = input.value.trim();

  // ✅ NEW: if empty → go home immediately
  if(!query){
    document.getElementById("stats").innerHTML = "";
    loadHome();
    return;
  }

  showLoading();

  let movies=[], tv=[], anime=[];

  try{
    const [m,t,a] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${query}`),
      fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${query}`),
      fetch("https://graphql.anilist.co",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          query:`query ($search:String){
            Page(perPage:10){
              media(search:$search,type:ANIME){
                id
                title{romaji}
                coverImage{large}
              }
            }
          }`,
          variables:{search:query}
        })
      })
    ]);

    const md = await m.json();
    const td = await t.json();
    const ad = await a.json();

    movies = (md.results||[]).map(i=>({
      type:"movie",
      id:i.id,
      title:i.title,
      poster:i.poster_path
        ? `https://image.tmdb.org/t/p/w500${i.poster_path}`
        : ""
    }));

    tv = (td.results||[]).map(i=>({
      type:"tv",
      id:i.id,
      title:i.name,
      poster:i.poster_path
        ? `https://image.tmdb.org/t/p/w500${i.poster_path}`
        : ""
    }));

    anime = (ad?.data?.Page?.media||[]).map(i=>({
      type:"anime",
      id:i.id,
      title:i.title.romaji,
      poster:i.coverImage.large
    }));

  }catch(e){
    console.error(e);
  }

  document.getElementById("stats").innerHTML =
    `🎬 ${movies.length} Movies | 📺 ${tv.length} TV | 🎌 ${anime.length} Anime`;

  render("movieCategory","movieResults",movies);
  render("tvCategory","tvResults",tv);
  render("animeCategory","animeResults",anime);

  hideLoading();
}

/* =========================
   RENDER FUNCTION
========================= */
function render(catId, rowId, data) {
  const cat = document.getElementById(catId);
  const row = document.getElementById(rowId);

  // clear previous content
  row.innerHTML = "";

  // hide category if empty
  if (!data.length) {
    cat.style.display = "none";
    return;
  }

  cat.style.display = "block";

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "movie";

    div.innerHTML = `
      <img src="${item.poster || 'https://via.placeholder.com/300x450?text=No+Image'}">
      <div class="movieInfo">
        <strong>${item.title}</strong>
        <div class="genre">${item.type.toUpperCase()}</div>
      </div>
    `;

    // ✅ CLICK OPENS VIDEO MODAL
    div.onclick = () => openModal(item);

    row.appendChild(div);
  });
}

function copyId(){
  if(!currentItem) return;
  navigator.clipboard.writeText(String(currentItem.id));
  showCopyModal(`${currentItem.title} | ID: ${currentItem.id}`);
}

function closeModal(){
  document.getElementById("detailModal").classList.remove("show");
  document.getElementById("videoContainer").innerHTML = "";
  currentItem = null;
}
  
function openModal(item){
  currentItem = item;

  document.getElementById("modalTitle").textContent = item.title;

  const container = document.getElementById("videoContainer");
  container.innerHTML = "";

  const iframe = document.createElement("iframe");
  iframe.allowFullscreen = true;
  iframe.setAttribute("allow", "encrypted-media");
  iframe.src = item.videasyUrl;

  container.appendChild(iframe);

  document.getElementById("detailModal").classList.add("show");

  // 🔥 LOAD DESCRIPTION + CONTROLS
  loadDetails(item);
}
  
  
/* =========================
   INIT HOME ON LOAD
========================= */
loadHome();

function goHome(){
  document.getElementById("searchInput").value = "";
  document.getElementById("stats").innerHTML = "";
  window.scrollTo({ top: 0, behavior: "smooth" });
  loadHome();
}

/* =========================
   horizontal scroll (desktop) and Touch drag (mobile swipe)
========================= */
document.querySelectorAll(".row").forEach(row => {

  function bounce() {
    row.classList.remove("bounce");
    void row.offsetWidth; // restart animation
    row.classList.add("bounce");
  }

  function isAtStart() {
    return row.scrollLeft <= 0;
  }

  function isAtEnd() {
    return row.scrollLeft >= row.scrollWidth - row.clientWidth - 1;
  }

  /* =========================
     MOUSE WHEEL SCROLL
  ========================= */
  row.addEventListener("wheel", e => {
    e.preventDefault();
    const scrollStep = 600;

    if (e.deltaY > 0) {
      if (isAtEnd()) {
        bounce();
        return;
      }
      // scroll but don't exceed end
      row.scrollLeft = Math.min(row.scrollLeft + scrollStep, row.scrollWidth - row.clientWidth);
    } else {
      if (isAtStart()) {
        bounce();
        return;
      }
      row.scrollLeft = Math.max(row.scrollLeft - scrollStep, 0);
    }
  }, { passive: false });

  /* =========================
     TOUCH DRAG (MOBILE SWIPE)
  ========================= */
  let isDown = false, startX = 0, scrollLeftStart = 0;

  row.addEventListener("touchstart", e => {
    isDown = true;
    startX = e.touches[0].pageX;
    scrollLeftStart = row.scrollLeft;
  });

  row.addEventListener("touchmove", e => {
    if (!isDown) return;
    e.preventDefault();

    const x = e.touches[0].pageX;
    const walk = (x - startX) * 1.5;
    let nextScroll = scrollLeftStart - walk;

    if (nextScroll < 0) {
      row.scrollLeft = 0;
      bounce();
    } else if (nextScroll > row.scrollWidth - row.clientWidth) {
      row.scrollLeft = row.scrollWidth - row.clientWidth;
      bounce();
    } else {
      row.scrollLeft = nextScroll;
    }
  }, { passive: false });

  row.addEventListener("touchend", () => {
    isDown = false;
  });
});

const scrollAmount = 600;

/* =========================
   ARROW SCROLL
========================= */
document.querySelectorAll(".arrow").forEach(btn => {
  btn.addEventListener("click", () => {
    const target = document.getElementById(btn.dataset.target);
    let scrollByAmount = btn.classList.contains("left") ? -scrollAmount : scrollAmount;

    // Compute new scroll position
    let newScroll = target.scrollLeft + scrollByAmount;

    // Check boundaries
    if (newScroll < 0 || newScroll > target.scrollWidth - target.clientWidth) {
      // Restart bounce animation
      target.classList.remove("bounce");
      void target.offsetWidth; // force reflow
      target.classList.add("bounce");
    } else {
      target.scrollBy({ left: scrollByAmount, behavior: "smooth" });
    }
  });
});

async function loadDetails(item){
  const overviewEl = document.getElementById("modalOverview");
  const box = document.getElementById("episodeControls");

  box.innerHTML = ""; // ✅ always reset first

  try {

    // MOVIE
    if(item.type === "movie"){
      box.style.display = "none"; // hide controls
      const res = await fetch(
        `https://api.themoviedb.org/3/movie/${item.id}?api_key=${TMDB_API_KEY}`
      );
      const data = await res.json();

      overviewEl.textContent = data.overview || "No description available.";
      return;
    }

    // TV SHOW
    if(item.type === "tv"){
      box.style.display = "block"; // show controls
      const res = await fetch(
        `https://api.themoviedb.org/3/tv/${item.id}?api_key=${TMDB_API_KEY}`
      );
      const data = await res.json();

      overviewEl.textContent = data.overview || "No description available.";

      renderTVControls(item.id);
      return;
    }

    // ANIME
    box.style.display = "block"; // show episode buttons
    overviewEl.textContent = "Anime details loading... (AniList API can be added later)";
    renderAnimeControls(item.id);

  } catch (e){
    console.error(e);
    overviewEl.textContent = "No description available.";
  }
}
  

function updateVideo(url){
  const container = document.getElementById("videoContainer");
  container.innerHTML = "";

  const iframe = document.createElement("iframe");
  iframe.allowFullscreen = true;
  iframe.setAttribute("allow", "encrypted-media");
  iframe.src = url;

  container.appendChild(iframe);
}


async function renderTVControls(tvId) {
  const box = document.getElementById("episodeControls");
  box.innerHTML = "Loading seasons...";

  try {
    const res = await fetch(
      `https://api.themoviedb.org/3/tv/${tvId}?api_key=${TMDB_API_KEY}`
    );
    const data = await res.json();

    box.innerHTML = "";

    // --- CREATE HORIZONTAL CONTAINER ---
    const controlsRow = document.createElement("div");
    controlsRow.style.display = "flex";
    controlsRow.style.alignItems = "center";
    controlsRow.style.gap = "10px";
    controlsRow.style.flexWrap = "wrap"; // allows wrap on small screens

    // --- SEASON SELECT ---
    const seasonSelect = document.createElement("select");
    data.seasons.forEach(season => {
      if (season.season_number === 0) return; // skip specials
      const opt = document.createElement("option");
      opt.value = season.season_number;
      opt.textContent = `Season ${season.season_number}`;
      seasonSelect.appendChild(opt);
    });

    // --- EPISODE SELECT ---
    const episodeSelect = document.createElement("select");

    // function to load episodes for selected season
    async function loadEpisodes(seasonNumber) {
      episodeSelect.innerHTML = ""; // clear old options

      const res = await fetch(
        `https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNumber}?api_key=${TMDB_API_KEY}`
      );
      const seasonData = await res.json();

      seasonData.episodes.forEach(ep => {
        const opt = document.createElement("option");
        opt.value = ep.episode_number;
        opt.textContent = `Episode ${ep.episode_number}`;
        episodeSelect.appendChild(opt);
      });

      // play first episode by default
      updateVideo(`https://player.videasy.net/tv/${tvId}/${seasonNumber}/${episodeSelect.value}`);
    }

    // --- EVENT LISTENERS ---
    seasonSelect.onchange = () => loadEpisodes(seasonSelect.value);
    episodeSelect.onchange = () => {
      updateVideo(`https://player.videasy.net/tv/${tvId}/${seasonSelect.value}/${episodeSelect.value}`);
    };

    // --- ADD TO CONTAINER ---
    controlsRow.appendChild(seasonSelect);
    controlsRow.appendChild(episodeSelect);
    box.appendChild(controlsRow);

    // --- LOAD FIRST SEASON BY DEFAULT ---
    loadEpisodes(1);

  } catch (e) {
    console.error(e);
    box.innerHTML = "Failed to load seasons";
  }
}

function renderAnimeControls(animeId){
  const box = document.getElementById("episodeControls");
  box.innerHTML = "";

  const epSelect = document.createElement("select");

  epSelect.style.padding = "8px";
  epSelect.style.borderRadius = "8px";
  epSelect.style.background = "#222";
  epSelect.style.color = "#fff";
  epSelect.style.border = "none";

  // optional default limit (you can increase later)
  const MAX_EP = 100;

  for(let i = 1; i <= MAX_EP; i++){
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = `Episode ${i}`;
    epSelect.appendChild(opt);
  }

  epSelect.onchange = () => {
    updateVideo(`https://player.videasy.net/anime/${animeId}/${epSelect.value}`);
  };

  box.appendChild(epSelect);
}
</script>
