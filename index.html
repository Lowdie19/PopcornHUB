<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FREE FLICKS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: Arial, sans-serif;
  background: #141414;
  color: #fff;
}

/* HERO */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(20,20,20,1));
}
.hero h1 {
  margin-bottom: 10px;
  font-size: 48px;
}
.red { color: #e50914; }
.hero p {
  color: #ccc;
  font-size: 18px;
}

/* SEARCH */
#searchContainer {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #141414ee;
  backdrop-filter: blur(10px);
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}
#searchInput {
  flex: 1;
  min-width: 250px;
  max-width: 500px;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid #333;
  outline: none;
  background: #222;
  color: #fff;
  font-size: 16px;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 30px;
  background: #e50914;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s;
}
button:hover { background: #ff1e2d; }

/* STATS */
#stats {
  text-align: center;
  color: #aaa;
  padding: 15px;
  font-size: 14px;
}

/* CATEGORIES */
.category {
  padding: 25px 30px;
}
.category h2 {
  margin-bottom: 15px;
  font-size: 22px;
  border-left: 5px solid #e50914;
  padding-left: 10px;
}

/* ROW */
.row {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  overflow-y: hidden;
  padding-bottom: 10px;
  align-items: flex-start;
  scroll-behavior: smooth;
  touch-action: pan-y;
 -webkit-overflow-scrolling: touch;

  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* IE 10+ */

  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}
.row::-webkit-scrollbar {
  display: none;
}

/* MOVIE CARDS */
.movie {
  min-width: 180px;
  max-width: 180px;
  height: 270px;
  cursor: pointer;
  position: relative;
  transition: transform 0.25s, box-shadow 0.25s;
}
.movie:hover {
  transform: scale(1.06);
  z-index: 5;
  will-change: transform;
}
.movie img {
  width: 100%;
  height: 100%;        /* IMPORTANT */
  object-fit: cover;
  display: block;      /* removes inline image gap bug */
  border-radius: 8px;
  
  user-drag: none;
  -webkit-user-drag: none; 
  pointer-events: none;
}
.movieInfo {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.95));
  opacity: 0;
  transform: translateY(20px);
  transition: 0.25s;
}
.movie:hover .movieInfo {
  opacity: 1;
  transform: translateY(0);
}
.genre {
  font-size: 13px;
  color: #ccc;
  margin-top: 5px;
}

/* LOADING */
#loading {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 999;
}
#bar {
  width: 300px;
  height: 6px;
  background: #333;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 15px;
}
#barFill {
  height: 100%;
  background: #e50914;
  animation: load 1.5s infinite;
}
@keyframes load {
  0% { width: 0%; }
  50% { width: 70%; }
  100% { width: 100%; }
}

/* COPY MODAL */
#copyModal {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) scale(0.8);
  background: #000;
  border: 1px solid #e50914;
  padding: 12px 18px;
  border-radius: 10px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  z-index: 100;
}
#copyModal.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

.carousel {
  position: relative;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 100%;
  border: none;
  border-radius: 0;
  background: transparent;
  color: #fff;
  font-size: 58px;
  cursor: pointer;
  z-index: 10;

  opacity: 0.4;
  transition: opacity 0.2s ease, transform 0.2s ease;

  /* center the arrow text */
  display: flex;
  align-items: center;
  justify-content: center;

  /* add font shadow */
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}

.arrow:hover {
  background-color: transparent;
  opacity: 1;
  transform: translateY(-50%) scale(1.1);
}

.arrow.left {
  left: 0;
}

.arrow.right {
  right: 0;
}

@keyframes bounce {
  0%   { transform: translateX(0); }
  25%  { transform: translateX(-10px); }
  50%  { transform: translateX(5px); }
  75%  { transform: translateX(-5px); }
  100% { transform: translateX(0); }
}

.row.bounce {
  animation: bounce 0.3s ease;
}

/* =========================
   VIDEO MODAL (NETFLIX STYLE)
========================= */

.detailModal {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 9999;
}

.detailModal.show {
  display: block;
}

/* DARK BACKDROP */
.modalBackdrop {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1;
}

/* MODAL BOX */
.videoModalContent {
  position: relative;

  width: min(1000px, calc(100vw - 20px));
  height: min(900px, calc(100dvh - 20px));

  margin: 10px auto;

  display: flex;
  flex-direction: column;

  background: #111;
  border-radius: 14px;
  overflow: hidden;
  z-index: 2
}

@keyframes modalPop {
  from { transform: scale(0.95); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* CLOSE BUTTON */
.closeBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  color: rgba(255, 255, 255, 0.51);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.3s ease, text-shadow 0.3s ease;
  z-index: 9999;
}
.closeBtn:hover {
  color: rgb(255, 255, 255);
  background: none;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}
.closeBtn.flash-red {
  color: red;
  text-shadow: 0 2px 8px rgba(255, 0, 0, 0.5);
}

/* VIDEO RESPONSIVE CONTAINER */
.videoContainer {
  flex: 1.2;
  position: relative;
  min-height: 200px;
}

.videoContainer iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  z-index: 1 !important;
}

/* INFO AREA */
.videoMeta {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.videoMeta h2 {
  margin-bottom: 5px;
  font-size: 20px;
}

.videoMeta p {
  margin: 3px 0;
  color: #aaa;
}

.modalButtons button {
  margin-top: 10px;
  padding: 10px 16px;
  border-radius: 20px;
  border: none;
  background: #e50914;
  color: #fff;
  cursor: pointer;
}

#episodeControls button:hover {
  background: #e50914 !important;
}

#episodeControls select {
  padding: 8px;
  border-radius: 8px;
  background: #222;
  color: #fff;
  border: none;
  margin-bottom: 10px;
}

#episodeControls{
  display: none;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}


.statLink{
  cursor:pointer;
  transition:0.2s;
}

.statLink:hover{
  color:#e50914;
}


/* =========================
   MOBILE HORIZONTAL MODAL
========================= */
@media (max-width: 768px) {

  .arrow {
    display: none;
  }

  .videoModalContent {
    display: flex;
  }

  /* VIDEO SIDE */
  .videoContainer {
    flex: 1.3;
    height: 100%;
    position: relative;
  }

  .videoContainer iframe {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  /* RIGHT PANEL */
  .videoMeta {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow-y: auto;
    background: #111;
    gap: 10px;
  }

  /* TITLE + DESCRIPTION */
  #modalTitle {
    font-size: 16px;
    line-height: 1.2;
  }

  #modalOverview {
    font-size: 13px;
    color: #aaa;
  }

  /* EPISODE CONTROLS FIX */
  #episodeControls {
    display: flex !important;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
  }

  #episodeControls select {
    width: 100%;
    font-size: 14px;
  }

  .hero {
    padding: 20px 20px 0px 20px;
  }
  .hero h1 {
    font-size: 30px;
  }
  .category {
    transform: scale(0.8);
    transform-origin: top left;
    width: 125vw;
  }
}

@media (orientation: portrait) {
  .videoModalContent {
    height: 70vh;
    flex-direction: column;
  }

  .videoContainer {
    flex: none;
    height: 40vh;
  }

  .videoMeta {
    flex: 1;
    overflow-y: auto;
  }

  #episodeControls {
    margin-top: auto;
  }
  .closeBtn {
    width: 40px;
    height: 40px;
    font-size: 20px; /* makes the ✕ bigger */
    z-index: 9999 !important;
  }
}

@media (orientation: landscape) {
  .videoModalContent {
    flex-direction: row;
  }

  .videoContainer {
    flex: 2.3;
    height: 100%;
  }

  .videoMeta {
    flex: 1;
    overflow-y: auto;
  }

  #episodeControls {
    margin-top: auto;
  }
  .closeBtn {
    width: 30px;
    height: 30px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<!-- VIDEO MODAL -->
<div id="detailModal" class="detailModal">
  <!-- dark background -->
  <div class="modalBackdrop" onclick="closeModal()"></div>

  <!-- modal box -->
  <div class="videoModalContent">

    <!-- close button -->
    <button class="closeBtn" onclick="closeModal()">✕</button>

    <!-- VIDEO AREA -->
    <div class="videoContainer" id="videoContainer"></div>

    <!-- INFO SECTION -->
    <div class="videoMeta">
      <h2 id="modalTitle">Title</h2>
      <p id="modalOverview" style="color:#aaa; line-height:1.4;"></p>

      <!-- ONLY FOR TV / ANIME -->
      <div id="episodeControls" style="margin-top:15px;"></div>
    </div>

  </div>
</div>

<header class="hero">
  <h1 onclick="goHome()" style="cursor:pointer;">
  <span class="red">FREE</span> FLICKS</h1>
  <p>Watch Movies, TV Shows & Anime for Free</p>
</header>

<div id="searchContainer">
  <input id="searchInput" placeholder="Search Movies, TV, Anime...">
  <button onclick="searchAll()">Search</button>
</div>

<div id="stats"></div>

<div id="loading">
  <div>Searching...</div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<!-- CATEGORIES -->
<div class="category" id="movieCategory">
  <h2><i style= "color: darkgray" class="fa-solid fa-film"></i> Movies</h2>
  <div class="carousel">
    <button class="arrow left" data-target="movieResults">‹</button>
    <div id="movieResults" class="row"></div>
    <button class="arrow right" data-target="movieResults">›</button>
  </div>
</div>

<div class="category" id="tvCategory">
  <h2><i style= "color: darkgray" class="fa-solid fa-clapperboard"></i> TV Shows</h2>
  <div class="carousel">
    <button class="arrow left" data-target="tvResults">‹</button>
    <div id="tvResults" class="row"></div>
    <button class="arrow right" data-target="tvResults">›</button>
  </div>
</div>

<div class="category" id="animeCategory">
  <h2><i style= "color: darkgray" class="fa-solid fa-tv"></i> Anime</h2>
  <div class="carousel">
    <button class="arrow left" data-target="animeResults">‹</button>
    <div id="animeResults" class="row"></div>
    <button class="arrow right" data-target="animeResults">›</button>
  </div>
</div>

<div id="copyModal">Copied: <span id="copyText"></span></div>

<script>
let currentItem = null;
const TMDB_API_KEY = "7124d4e6e0feb015f07fc9a57bc27227";

const loading = document.getElementById("loading");
const copyModal = document.getElementById("copyModal");
const copyText = document.getElementById("copyText");

// Loading / Copy Modal
function showLoading(){ loading.style.display="flex"; }
function hideLoading(){ loading.style.display="none"; }
function showCopyModal(text){
  copyText.textContent = text;
  copyModal.classList.add("show");
  setTimeout(()=>copyModal.classList.remove("show"),1500);
}

// Debounced search
let timeout;
const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("keydown", e => { if(e.key==="Enter") searchAll(); });
searchInput.addEventListener("input", () => { clearTimeout(timeout); timeout = setTimeout(searchAll, 600); });

// Load top content
async function loadHome(){
  showLoading();
  try{
    const [m,t,a] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/movie/top_rated?api_key=${TMDB_API_KEY}&language=en-US&page=1`),
      fetch(`https://api.themoviedb.org/3/tv/top_rated?api_key=${TMDB_API_KEY}&language=en-US&page=1`),
      fetch("https://graphql.anilist.co",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          query:`query { Page(perPage:10){ media(type:ANIME, sort:POPULARITY_DESC){ id title{romaji} coverImage{large} } } }`
        })
      })
    ]);

    const md = await m.json();
    const td = await t.json();
    const ad = await a.json();

    const movies = (md.results||[]).map(i=>({
      type:"movie", id:i.id, title:i.title,
      poster:i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : "",
      videasyUrl:`https://player.videasy.net/movie/${i.id}`
    }));

    const tv = (td.results||[]).map(i=>({
      type:"tv", id:i.id, title:i.name,
      poster:i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : "",
      videasyUrl:`https://player.videasy.net/tv/${i.id}/1/1`
    }));

    const anime = (ad?.data?.Page?.media||[]).map(i=>({
      type:"anime", id:i.id, title:i.title.romaji,
      poster:i.coverImage.large,
      videasyUrl:`https://player.videasy.net/anime/${i.id}/1`
    }));

    render("movieCategory","movieResults",movies);
    render("tvCategory","tvResults",tv);
    render("animeCategory","animeResults",anime);

  }catch(e){ console.error(e); }
  hideLoading();
}

// Search
async function searchAll(){
  const query = searchInput.value.trim();
  if(!query){ document.getElementById("stats").innerHTML = ""; loadHome(); return; }

  showLoading();
  try{
    const [m,t,a] = await Promise.all([
      fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${query}`),
      fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${query}`),
      fetch("https://graphql.anilist.co",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          query:`query ($search:String){ Page(perPage:10){ media(search:$search,type:ANIME){ id title{romaji} coverImage{large} } } }`,
          variables:{search:query}
        })
      })
    ]);

    const md = await m.json();
    const td = await t.json();
    const ad = await a.json();

    const movies = (md.results||[]).map(i=>({ type:"movie", id:i.id, title:i.title, poster:i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : "" }));
    const tv = (td.results||[]).map(i=>({ type:"tv", id:i.id, title:i.name, poster:i.poster_path ? `https://image.tmdb.org/t/p/w500${i.poster_path}` : "" }));
    const anime = (ad?.data?.Page?.media||[]).map(i=>({ type:"anime", id:i.id, title:i.title.romaji, poster:i.coverImage.large }));

    document.getElementById("stats").innerHTML =
      `<span class="statLink" onclick="scrollToCategory('movieCategory')"><i class="fa-solid fa-film"></i> ${movies.length} Movies</span>
       &nbsp;|&nbsp;
       <span class="statLink" onclick="scrollToCategory('tvCategory')"><i class="fa-solid fa-clapperboard"></i> ${tv.length} TV Shows</span>
       &nbsp;|&nbsp;
       <span class="statLink" onclick="scrollToCategory('animeCategory')"><i class="fa-solid fa-tv"></i> ${anime.length} Anime</span>`;

    render("movieCategory","movieResults",movies);
    render("tvCategory","tvResults",tv);
    render("animeCategory","animeResults",anime);

  }catch(e){ console.error(e); }
  hideLoading();
}

// Render
function render(catId,rowId,data){
  const cat = document.getElementById(catId);
  const row = document.getElementById(rowId);
  row.innerHTML = "";
  if(!data.length){ cat.style.display="none"; return; }
  cat.style.display="block";

  data.forEach(item=>{
    const div = document.createElement("div");
    div.className = "movie";
    div.innerHTML = `<img src="${item.poster || 'https://via.placeholder.com/300x450?text=No+Image'}">
                     <div class="movieInfo"><strong>${item.title}</strong><div class="genre">${item.type.toUpperCase()}</div></div>`;
    div.onclick = ()=>openModal(item);
    row.appendChild(div);
  });
}

// Modals
function copyId(){ if(!currentItem) return; navigator.clipboard.writeText(String(currentItem.id)); showCopyModal(`${currentItem.title} | ID: ${currentItem.id}`); }
function closeModal() {
  const closeBtn = document.querySelector(".closeBtn");
  
  // Flash red first
  closeBtn.classList.add("flash-red");

  // Wait for the transition to finish before closing
  setTimeout(() => {
    document.getElementById("detailModal").classList.remove("show");
    document.getElementById("videoContainer").innerHTML = "";
    currentItem = null;

    // Reset the button color
    closeBtn.classList.remove("flash-red");
  }, 300); // match the CSS transition duration
}
function openModal(item){
  currentItem = item;
  document.getElementById("modalTitle").textContent = item.title;
  const container = document.getElementById("videoContainer");
  container.innerHTML="";
  const iframe = document.createElement("iframe");
  iframe.allowFullscreen = true;
  iframe.setAttribute("allow","encrypted-media");
  iframe.src=item.videasyUrl;
  container.appendChild(iframe);
  document.getElementById("detailModal").classList.add("show");
  loadDetails(item);
}


async function loadDetails(item){
  const overviewEl = document.getElementById("modalOverview");
  const box = document.getElementById("episodeControls");

  box.innerHTML = "";

  try {

    if(item.type === "movie"){
      box.style.display = "none";

      const res = await fetch(
        `https://api.themoviedb.org/3/movie/${item.id}?api_key=${TMDB_API_KEY}`
      );
      const data = await res.json();

      overviewEl.textContent = data.overview || "No description available.";
      return;
    }

    if(item.type === "tv"){
      box.style.display = "block";   // 🔥 RESTORE THIS

      const res = await fetch(
        `https://api.themoviedb.org/3/tv/${item.id}?api_key=${TMDB_API_KEY}`
      );
      const data = await res.json();

      overviewEl.textContent = data.overview || "No description available.";
      renderTVControls(item.id);
      return;
    }

    box.style.display = "block"; // 🔥 RESTORE THIS
    overviewEl.textContent = "Anime details loading...";
    renderAnimeControls(item.id);

  } catch (e){
    console.error(e);
    overviewEl.textContent = "No description available.";
  }
}



// Update video
function updateVideo(url){
  const container = document.getElementById("videoContainer");
  container.innerHTML="";
  const iframe = document.createElement("iframe");
  iframe.allowFullscreen = true;
  iframe.setAttribute("allow","encrypted-media");
  iframe.src = url;
  container.appendChild(iframe);
}

// Render TV/Anime Controls
async function renderTVControls(tvId){
  const box=document.getElementById("episodeControls");
  box.innerHTML="Loading seasons...";
  try{
    const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}?api_key=${TMDB_API_KEY}`);
    const data = await res.json();
    box.innerHTML="";
    const controlsRow=document.createElement("div");
    controlsRow.style.display="flex"; controlsRow.style.alignItems="center"; controlsRow.style.gap="10px"; controlsRow.style.flexWrap="wrap";

    const seasonSelect=document.createElement("select");
    data.seasons.forEach(season=>{ if(season.season_number===0) return; const opt=document.createElement("option"); opt.value=season.season_number; opt.textContent=`Season ${season.season_number}`; seasonSelect.appendChild(opt); });
    const episodeSelect=document.createElement("select");

    async function loadEpisodes(seasonNumber){
      episodeSelect.innerHTML="";
      const res = await fetch(`https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNumber}?api_key=${TMDB_API_KEY}`);
      const seasonData = await res.json();
      seasonData.episodes.forEach(ep=>{ const opt=document.createElement("option"); opt.value=ep.episode_number; opt.textContent=`Episode ${ep.episode_number}`; episodeSelect.appendChild(opt); });
      updateVideo(`https://player.videasy.net/tv/${tvId}/${seasonNumber}/${episodeSelect.value}`);
    }

    seasonSelect.onchange = ()=>loadEpisodes(seasonSelect.value);
    episodeSelect.onchange = ()=>updateVideo(`https://player.videasy.net/tv/${tvId}/${seasonSelect.value}/${episodeSelect.value}`);
    controlsRow.appendChild(seasonSelect); controlsRow.appendChild(episodeSelect); box.appendChild(controlsRow);
    loadEpisodes(1);

  }catch(e){ console.error(e); box.innerHTML="Failed to load seasons"; }
}

function renderAnimeControls(animeId){
  const box=document.getElementById("episodeControls");
  box.innerHTML="";
  const epSelect=document.createElement("select");
  epSelect.style.padding="8px"; epSelect.style.borderRadius="8px"; epSelect.style.background="#222"; epSelect.style.color="#fff"; epSelect.style.border="none";
  const MAX_EP=100;
  for(let i=1;i<=MAX_EP;i++){ const opt=document.createElement("option"); opt.value=i; opt.textContent=`Episode ${i}`; epSelect.appendChild(opt);}
  epSelect.onchange=()=>updateVideo(`https://player.videasy.net/anime/${animeId}/${epSelect.value}`);
  box.appendChild(epSelect);
}

// Home button
function goHome(){ searchInput.value=""; document.getElementById("stats").innerHTML=""; window.scrollTo({ top:0, behavior:"smooth" }); loadHome(); }

// ================================
// HORIZONTAL SCROLL + ARROWS + BOUNCE
// ================================

function setupRowScrolling() {
  const scrollAmount = 600;
  const rows = document.querySelectorAll(".row");

  rows.forEach(row => {

    // =========================
    // ROW STATE (IMPORTANT FIX)
    // =========================
    row._isMouseDown = false;
    row._isTouchDown = false;
    row._isDraggingHorizontally = false;

    // =========================
    // BOUNCE
    // =========================
    const bounce = () => {
      row.classList.remove("bounce");
      void row.offsetWidth;
      row.classList.add("bounce");
    };

    const maxScroll = () => row.scrollWidth - row.clientWidth;

    // =========================
    // DESKTOP DRAG
    // =========================
    row.addEventListener("mousedown", e => {
      row._isMouseDown = true;
      row._startX = e.pageX;
      row._scrollStart = row.scrollLeft;
      row.style.cursor = "grabbing";
    });

    window.addEventListener("mouseup", () => {
      row._isMouseDown = false;
      row.style.cursor = "grab";
    });

    row.addEventListener("mousemove", e => {
      if (!row._isMouseDown) return;

      e.preventDefault();

      const walk = e.pageX - row._startX;
      let next = row._scrollStart - walk;

      if (next < 0) {
        row.scrollLeft = 0;
        bounce();
        return;
      }

      if (next > maxScroll()) {
        row.scrollLeft = maxScroll();
        bounce();
        return;
      }

      row.scrollLeft = next;
    });

    // =========================
    // TOUCH DRAG
    // =========================
    row.addEventListener("touchstart", e => {
      row._isTouchDown = true;
      row._isDraggingHorizontally = false;

      row._touchStartX = e.touches[0].pageX;
      row._touchStartY = e.touches[0].pageY;
      row._touchScrollStart = row.scrollLeft;
    });

    row.addEventListener("touchmove", e => {
      if (!row._isTouchDown) return;

      const x = e.touches[0].pageX;
      const y = e.touches[0].pageY;

      const deltaX = Math.abs(x - row._touchStartX);
      const deltaY = Math.abs(y - row._touchStartY);

      // decide scroll direction
      if (!row._isDraggingHorizontally) {
        if (deltaY > deltaX) return;
        if (deltaX > 25 && deltaX > deltaY * 1.5) {
          row._isDraggingHorizontally = true;
        }
      }

      if (!row._isDraggingHorizontally) return;

      e.preventDefault();

      let next = row._touchScrollStart - (x - row._touchStartX);

      if (next < 0) {
        row.scrollLeft = 0;
        bounce();
        return;
      }

      if (next > maxScroll()) {
        row.scrollLeft = maxScroll();
        bounce();
        return;
      }

      row.scrollLeft = next;
    }, { passive: false });

    row.addEventListener("touchend", () => {
      row._isTouchDown = false;
    });

  });

  // =========================
  // ARROW BUTTONS (FIXED)
  // =========================
  document.querySelectorAll(".arrow").forEach(btn => {
    btn.addEventListener("click", () => {
      const target = document.getElementById(btn.dataset.target);
      const scrollByAmount = btn.classList.contains("left")
        ? -scrollAmount
        : scrollAmount;

      const maxScroll = target.scrollWidth - target.clientWidth;
      const newScroll = target.scrollLeft + scrollByAmount;

      if (newScroll < 0) {
        target.scrollLeft = 0;
        bounceTarget(target);
        resetRowState(target);
        return;
      }

      if (newScroll > maxScroll) {
        target.scrollLeft = maxScroll;
        bounceTarget(target);
        resetRowState(target);
        return;
      }

      target.scrollBy({ left: scrollByAmount, behavior: "smooth" });

      resetRowState(target);
    });
  });

  function resetRowState(row) {
    row._isMouseDown = false;
    row._isTouchDown = false;
    row._isDraggingHorizontally = false;
  }

  function bounceTarget(row) {
    // Prevent drag interference
    row._isMouseDown = false;
    row._isTouchDown = false;
    row._isDraggingHorizontally = false;

    // Trigger bounce
    row.classList.remove("bounce");
    void row.offsetWidth;
    row.classList.add("bounce");

    // After animation ends, ensure scroll and flags are correct
    row.addEventListener("animationend", function handler() {
      row.classList.remove("bounce");
      row._isMouseDown = false;
      row._isTouchDown = false;
      row._isDraggingHorizontally = false;
      row.removeEventListener("animationend", handler);
    });
  }
}

// INIT
setupRowScrolling();

// Initial load
loadHome();
</script>
