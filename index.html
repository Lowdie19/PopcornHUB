<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIDEASY ID SEARCH V2</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#141414;
  color:#fff;
}

.hero{
  text-align:center;
  padding:40px 20px;
  background:linear-gradient(rgba(0,0,0,.7),rgba(20,20,20,1));
}

.hero h1{
  margin:0;
  font-size:48px;
}

.red{color:#e50914}

.hero p{
  color:#aaa;
  margin-top:10px;
}

#searchContainer{
  position:sticky;
  top:0;
  z-index:100;
  background:#141414ee;
  backdrop-filter:blur(10px);
  padding:20px;
  text-align:center;
  border-bottom:1px solid #222;
}

#searchInput{
  width:450px;
  max-width:80%;
  padding:12px 15px;
  border-radius:30px;
  outline:none;
  border:1px solid #333;
  background:#222;
  color:#fff;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:30px;
  margin-left:8px;
  background:#e50914;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#ff1e2d;
}

#stats{
  text-align:center;
  color:#aaa;
  padding:12px;
}

#movies{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:20px;
  padding:30px;
}

.movie{
  position:relative;
  overflow:hidden;
  cursor:pointer;
  transition:.25s;
}

.movie:hover{
  transform:scale(1.05);
  z-index:5;
}

.movie img{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  border-radius:8px;
  box-shadow:0 10px 20px rgba(0,0,0,.5);
  transition:transform .35s ease;
}

.movie:hover img{
  transform:scale(1.1);
}

.movieInfo{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px;
  background:linear-gradient(transparent,rgba(0,0,0,.95));
  opacity:0;
  transform:translateY(20px);
  transition:.25s;
}

.movie:hover .movieInfo{
  opacity:1;
  transform:translateY(0);
}

.genre{
  color:#ccc;
  font-size:13px;
  margin-top:6px;
}

#loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#bar{
  width:300px;
  height:6px;
  background:#333;
  overflow:hidden;
  border-radius:6px;
  margin-top:15px;
}

#barFill{
  height:100%;
  background:#e50914;
  animation:load 1.5s infinite;
}

@keyframes load{
  0%{width:0%}
  50%{width:70%}
  100%{width:100%}
}

#copyModal{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%) scale(.8);
  background:#000;
  border:1px solid #e50914;
  padding:12px 18px;
  border-radius:10px;
  opacity:0;
  transition:.25s;
  pointer-events:none;
}

#copyModal.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}
</style>
</head>
<body>

<header class="hero">
  <h1><span class="red">VIDEASY</span> ID SEARCH</h1>
  <p>Search Movies, TV Shows & Anime IDs</p>
</header>

<div id="searchContainer">
  <input id="searchInput" placeholder="Search movies, TV, anime...">
  <button onclick="searchAll()">Search</button>
</div>

<div id="stats"></div>

<div id="loading">
  <div>Searching database...</div>
  <div id="bar"><div id="barFill"></div></div>
</div>

<div id="movies"></div>

<div id="copyModal">Copied: <span id="copyText"></span></div>

<script>
const TMDB_API_KEY = "YOUR_TMDB_API_KEY_HERE";

const moviesContainer = document.getElementById("movies");
const loading = document.getElementById("loading");
const copyModal = document.getElementById("copyModal");
const copyText = document.getElementById("copyText");

function showLoading(){loading.style.display="flex";}
function hideLoading(){loading.style.display="none";}

document.getElementById("searchInput").addEventListener("keydown",e=>{
 if(e.key==="Enter") searchAll();
});

let searchTimeout;
document.getElementById("searchInput").addEventListener("input",()=>{
 clearTimeout(searchTimeout);
 searchTimeout=setTimeout(searchAll,700);
});

async function searchAll(){
 const query=document.getElementById("searchInput").value.trim();
 if(!query) return;

 showLoading();
 moviesContainer.innerHTML="";

 let movies=[],tv=[],anime=[];

 try{
   const res=await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
   const data=await res.json();

   movies=(data.results||[])
   .sort((a,b)=>b.popularity-a.popularity)
   .map(m=>({
      type:"movie",
      id:m.id,
      title:m.title,
      poster:m.poster_path?`https://image.tmdb.org/t/p/w500${m.poster_path}`:""
   }));
 }catch(e){console.error(e);}

 try{
   const res=await fetch(`https://api.themoviedb.org/3/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
   const data=await res.json();

   tv=(data.results||[])
   .sort((a,b)=>b.popularity-a.popularity)
   .map(t=>({
      type:"tv",
      id:t.id,
      title:t.name,
      poster:t.poster_path?`https://image.tmdb.org/t/p/w500${t.poster_path}`:""
   }));
 }catch(e){console.error(e);}

 try{
   const res=await fetch("https://graphql.anilist.co",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       query:`query ($search: String) {
         Page(perPage:10){
           media(search:$search,type:ANIME){
             id
             title{romaji}
             coverImage{large}
           }
         }
       }`,
       variables:{search:query}
     })
   });

   const data=await res.json();

   anime=(data?.data?.Page?.media||[]).map(a=>({
      type:"anime",
      id:a.id,
      title:a.title.romaji,
      poster:a.coverImage.large
   }));
 }catch(e){console.error(e);}

 document.getElementById("stats").innerHTML=`
 🎬 Movies: ${movies.length}
 &nbsp;&nbsp;&nbsp; 📺 TV Shows: ${tv.length}
 &nbsp;&nbsp;&nbsp; 🎌 Anime: ${anime.length}
 `;

 displayResults([...movies,...tv,...anime]);

 hideLoading();
}

function displayResults(list){

 moviesContainer.innerHTML="";

 if(!list.length){
   moviesContainer.innerHTML=`
   <div style="grid-column:1/-1;text-align:center;padding:80px;color:#777;font-size:20px;">
   No results found.
   </div>`;
   return;
 }

 list.forEach(item=>{

   const div=document.createElement("div");
   div.className="movie";

   let icon="",label="";
   if(item.type==="movie"){icon="🎬";label="Movie";}
   if(item.type==="tv"){icon="📺";label="TV Show";}
   if(item.type==="anime"){icon="🎌";label="Anime";}

   div.innerHTML=`
   <img loading="lazy"
   src="${item.poster || 'https://via.placeholder.com/300x450?text=No+Image'}"
   onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">

   <div class="movieInfo">
      <strong>${item.title}</strong>
      <div class="genre">${icon} ${label}</div>
   </div>`;

   div.onclick=async()=>{
      try{
        await navigator.clipboard.writeText(String(item.id));
        showCopyModal(`${item.title} | ID: ${item.id}`);

        div.animate(
        [
         {transform:'scale(1)'},
         {transform:'scale(.92)'},
         {transform:'scale(1)'}
        ],
        {duration:250}
        );
      }catch(err){
        console.error(err);
      }
   };

   moviesContainer.appendChild(div);
 });
}

function showCopyModal(text){
 copyText.textContent=text;
 copyModal.classList.add("show");

 setTimeout(()=>{
   copyModal.classList.remove("show");
 },1500);
}
</script>

</body>
</html>
